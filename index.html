function startTest(){
    document.getElementById("page-home").classList.add("hidden");
    document.getElementById("page-question").classList.remove("hidden");
    renderQuestion();
}

function renderQuestion(){
    const q = questions[currentQ];
    document.getElementById("question-text").innerText = q.q;
    document.getElementById("q-index").innerText = `第${currentQ+1}题 / 共30题`;
    document.getElementById("stage-label").innerText = currentQ <10 ? "第一阶段 (๑>ᴗ<๑)" : "第二阶段 (≧∇≦)";
    const wrap = document.getElementById("option-wrap");
    const items = wrap.querySelectorAll(".option-item");
    for(let i=0;i<4;i++){
        items[i].innerText = q.opts[i];
        items[i].classList.remove("selected");
    }
    //上一题按钮，第1题隐藏，第2题开始显示
    const prevBtn = document.getElementById("prev-btn");
    if(currentQ === 0){
        prevBtn.classList.add("hidden");
    }else{
        prevBtn.classList.remove("hidden");
    }
    if(answers[currentQ] !== undefined){
        const saved = answers[currentQ];
        items[saved].classList.add("selected");
    }
}

function selectOption(i){
    const q = questions[currentQ];
    answers[currentQ] = i;
    const typeIdx = q.score[i];
    if(typeIdx >=0) scores[typeIdx] += 3;

    const items = document.querySelectorAll(".option-item");
    items.forEach(el=>el.classList.remove("selected"));
    items[i].classList.add("selected");

    // 选完自动跳转下一题
    currentQ++;
    if(currentQ >= questions.length){
        showResult();
        return;
    }
    renderQuestion();
}

function prevQuestion(){
    if(currentQ <=0) return;
    currentQ--;
    renderQuestion();
}

function showResult(){
    document.getElementById("page-question").classList.add("hidden");
    document.getElementById("page-result").classList.remove("hidden");
    //排序
    let arr = scores.map((v,i)=>({name:names[i],val:v,color:barColors[i]}));
    arr.sort((a,b)=>b.val - a.val);
    const top1 = arr[0], top2=arr[1], top3=arr[2];
    const total = arr.reduce((s,i)=>s+i.val,0);
    //绘制条形图
    let barHtml = "";
    arr.slice(0,3).forEach(item=>{
        const pct = total>0 ? (item.val/total*100).toFixed(1) : 0;
        barHtml += `
        <div class="mb-3">
            <div class="flex justify-between mb-1">
                <span>${item.name}</span>
                <span>${pct}%</span>
            </div>
            <div class="w-full bg-gray-100 rounded-full h-5">
                <div class="h-5 rounded-full" style="width:${pct}%;background:${item.color}"></div>
            </div>
        </div>
        `;
    })
    document.getElementById("bar-container").innerHTML = barHtml;
    //简短概述
    document.getElementById("summary-text").innerText = `你的核心思维底色偏向${top1.name}，同时带有一部分${top2.name}的特质，${top3.name}只在少数场景偶尔浮现，你的思考方式大多由第一名的主义主导，遇到压力、独处抉择时第二名的特质才会悄悄出现 ヾ(≧▽≦*)o`;

    // 报告文本，圆角马卡龙小标题框，字号大于正文
    const color1 = top1.color;
    const color2 = top2.color;
    const color3 = top3.color;

    let html = `
    <h3 class="text-xl text-[#81A1C1] mb-3">${top1.name}</h3>
    <span class="title-box" style="background:${color1}">人格解析</span>
    <p>${descAll[top1.name].split("专属生活提升指南")[0]}</p>
    <span class="title-box" style="background:${color1}">专属生活提升指南</span>
    <p>${descAll[top1.name].split("专属生活提升指南")[1]}</p>
    <p>这段特质构成了你思考世界最基础的框架，大多数日常选择都会遵循这套逻辑 🪐</p>
    <hr class="my-6">
    <h3 class="text-xl text-[#81A1C1] mb-3">${top2.name}</h3>
    <span class="title-box" style="background:${color2}">人格解析</span>
    <p>相较于第一主导倾向，你的${top2.name}倾向更浅、属于次要辅助人格，并非你的核心底色。这份特质不会主导你的人生决策，只会在特定情绪、压力场景、独处迷茫时显现，作为你人格的补充侧面。平时大多数时候，你都会以${top1.name}的思维优先行事，只有在疲惫、孤独、受挫时，这份辅助特质才会悄悄流露。它让你的人格不再单一极端，多了一份层次感和柔软度，中和了主导特质的极端性，让你为人处世更加温和、包容、立体。但因为倾向偏弱，不会成为你的主流性格，也不会长期影响你的生活状态。</p>
    <span class="title-box" style="background:${color2}">专属生活提升指南</span>
    <p>${descAll[top2.name].split("专属生活提升指南")[1]}</p>
    <p>它更像是藏在性格里的小侧面，不会轻易左右你的大决定 ✨</p>
    <hr class="my-6">
    <h3 class="text-xl text-gray-600 mb-3">${top3.name}</h3>
    <span class="title-box" style="background:${color3}">人格解析</span>
    <p>该特质占比极低，属于隐性人格碎片，几乎不会影响你的日常思维与生活，仅作人格参考，无需重点关注。(・ω・)</p>
    <span class="title-box" style="background:${color3}">专属生活提升指南</span>
    <p>这个特质在你身上表现微弱，一般很难在你的选择和想法里体现，不必刻意关注。</p>
    `;
    document.getElementById("result-content").innerHTML = html;
}
</script>
</body>
</html>
